name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:   # <-- this is the job_id
    runs-on: ubuntu-latest

    # Step 5: Inject API_KEY from GitHub Secrets
    env:
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Debug API_KEY presence
        run: |
          if [ -z "$API_KEY" ]; then
            echo "API_KEY is NOT set"
          else
            echo "API_KEY is set (masked)"
          fi

      - name: Run tests with Maven
        run: mvn test
